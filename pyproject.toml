[project]
name = "label-verify"
version = "0.1.0"
description = "TTB alcohol beverage label verification prototype"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Importing a fixture by name into another test module is how pytest shares
# it; the "redefinition" is the point.
"tests/test_security.py" = ["B011", "F811"]
# File()/Form() in argument defaults is FastAPI's documented idiom for
# declaring multipart parameters. Scoped to the API module rather than
# disabled globally, so the rule still catches genuine mutable-default bugs
# everywhere else.
"api/*" = ["B008"]

[tool.bandit]
# Reviewed and skipped, with reasons (docs/SECURITY.md, "Checked and found sound"):
#   B101  assert — used for internal invariants in code paths that are also
#         covered by tests, never to validate untrusted input.
#   B610  Django `.extra()` — this project has no Django; the rule matches a
#         local helper named `extra` in the warning-statement word diff.
# Anything else bandit finds should fail `make audit` and be looked at.
skips = ["B101", "B610"]
