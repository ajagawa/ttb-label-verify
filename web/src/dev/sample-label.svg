<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <!-- DEV ONLY. Synthetic label used by the ?mock=1 development mode so the
       results view and bbox overlay can be checked without the OCR backend.
       Text uses textLength so its extent matches the boxes in mockResult.ts. -->
  <rect width="800" height="1100" fill="#f3ead7"/>
  <rect x="24" y="24" width="752" height="1052" fill="none" stroke="#5a3b1c" stroke-width="6"/>
  <text x="98" y="202" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#3b2410" textLength="605" lengthAdjust="spacingAndGlyphs">OLD TOM DISTILLERY</text>
  <text x="120" y="292" font-family="Georgia, serif" font-size="34" fill="#3b2410" textLength="560" lengthAdjust="spacingAndGlyphs">Kentucky Straight Bourbon Whiskey</text>
  <circle cx="400" cy="480" r="120" fill="none" stroke="#5a3b1c" stroke-width="4"/>
  <text x="400" y="495" font-family="Georgia, serif" font-size="44" text-anchor="middle" fill="#5a3b1c">EST. 1887</text>
  <text x="80" y="724" font-family="Arial, sans-serif" font-size="30" fill="#222" textLength="375" lengthAdjust="spacingAndGlyphs">45% Alc./Vol. (90 Proof)</text>
  <text x="610" y="724" font-family="Arial, sans-serif" font-size="30" fill="#222" textLength="110" lengthAdjust="spacingAndGlyphs">700 mL</text>
  <g font-family="Arial, sans-serif" font-size="21" fill="#111">
    <text x="80" y="890" textLength="640" lengthAdjust="spacingAndGlyphs"><tspan font-weight="bold">GOVERNMENT WARNING:</tspan> (1) According to the Surgeon General, women</text>
    <text x="80" y="924" textLength="640" lengthAdjust="spacingAndGlyphs">should not drink alcoholic beverages during pregnancy because of</text>
    <text x="80" y="958" textLength="640" lengthAdjust="spacingAndGlyphs">the risk of birth defects. (2) Consumption of alcoholic beverages</text>
    <text x="80" y="992" textLength="640" lengthAdjust="spacingAndGlyphs">impairs your ability to drive a car or operate machinery, and</text>
    <text x="80" y="1026" textLength="260" lengthAdjust="spacingAndGlyphs">can cause health problems.</text>
  </g>
</svg>
